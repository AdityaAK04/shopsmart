server:
  port: 8079

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: retailer
          uri: http://localhost:8080
          predicates:
            - Path=/shopsmart/retailer/**
        - id: shop
          uri: http://localhost:8081
          predicates:
            - Path=/shopsmart/shop/**
        - id: product
          uri: http://localhost:8082
          predicates:
            - Path=/shopsmart/product/**
        - id: customerService
          uri: http://localhost:8091
          predicates:
            - Path=/customers/**
        - id: retailer
          uri: http://localhost:8088
          predicates:
            - Path=/shopsmart/loyalty/**
        - id: retailer
          uri: http://localhost:8089
          predicates:
            - Path=/shopsmart/loyaltyTransaction/**


